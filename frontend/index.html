<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hummify — Hum → Style → Beat</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <h1>🎵 Hummify</h1>
    <p>Hum a melody → Choose a style → Get a beat</p>
    <section>
      <button id="recordBtn">● Record</button>
      <button id="stopBtn" disabled>■ Stop</button>
      <audio id="preview" controls></audio>
    </section>
    <section>
      <label>Style <select id="style"></select></label>
      <label>Tempo <input id="tempo" type="number" value="90" min="60" max="180" /></label>
      <label>Mood <input id="mood" type="text" value="chill" /></label>
      <button id="generateBtn" disabled>Generate Beat</button>
    </section>
    <pre id="output"></pre>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
